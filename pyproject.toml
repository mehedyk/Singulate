[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "singulate"
version = "1.0.0"
description = "One file, one commit: commit every changed file separately, with login checks and guided conflict resolution."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "mehedyk" }]
keywords = ["git", "commit", "github", "automation", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/mehedyk/Singulate"
Repository = "https://github.com/mehedyk/Singulate"
Issues = "https://github.com/mehedyk/Singulate/issues"
Author = "https://mehedy.netlify.app"

[project.scripts]
singulate = "singulate:main"
singulate-pro = "singulate_pro:main"
singulate-simple = "simple_push:main"

[tool.setuptools]
py-modules = ["singulate", "singulate_pro", "simple_push"]

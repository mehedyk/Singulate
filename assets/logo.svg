<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Singulate - one file, one commit. By mehedyk" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Singulate - one file, one commit</title>
  <style>
    text { font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .t   { transform-box: fill-box; transform-origin: center; }

    /* every element loops on the same 9s clock; delays create the stagger */
    .line  { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 9s ease-in-out infinite; }
    .file  { opacity: 0; animation: drop 9s ease-in infinite; }
    .node  { opacity: 0; transform: scale(0); animation: pop 9s ease-out infinite; }
    .title { animation: type 9s steps(9, end) infinite; }
    .tag   { opacity: 0; animation: fade 9s ease-out infinite; }
    .cur   { animation: blink 1s steps(1) infinite; }
    .curmove { animation: move 9s steps(9, end) infinite; }

    .d1 { animation-delay: 0s; } .d2 { animation-delay: .45s; }
    .d3 { animation-delay: .9s; } .d4 { animation-delay: 1.35s; }

    @keyframes draw {
      0%   { stroke-dashoffset: 300; }
      12%  { stroke-dashoffset: 0; }
      90%  { stroke-dashoffset: 0; opacity: 1; }
      97%  { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 300; opacity: 0; }
    }
    @keyframes drop {
      0%   { opacity: 0; transform: translateY(-22px); }
      4%   { opacity: 1; transform: translateY(-22px); }
      11%  { opacity: 1; transform: translateY(34px); }
      13%  { opacity: 0; transform: translateY(40px); }
      100% { opacity: 0; transform: translateY(40px); }
    }
    @keyframes pop {
      0%, 10% { opacity: 0; transform: scale(0); }
      15%     { opacity: 1; transform: scale(1.35); }
      19%     { opacity: 1; transform: scale(1); }
      90%     { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(.6); }
    }
    @keyframes type {
      0%, 24%   { clip-path: inset(0 100% 0 0); }
      44%, 90%  { clip-path: inset(0 0 0 0); }
      97%, 100% { clip-path: inset(0 100% 0 0); }
    }
    @keyframes fade {
      0%, 44% { opacity: 0; }
      52%, 90% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }
    @keyframes move {
      0%, 24%   { transform: translateX(0); }
      44%, 90%  { transform: translateX(238px); }
      97%, 100% { transform: translateX(0); }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .line, .file, .node, .title, .tag, .cur, .curmove { animation: none !important; }
      .line { stroke-dashoffset: 0; } .node, .tag { opacity: 1; transform: none; } .file { opacity: 0; }
      .title { clip-path: none; } .cur { opacity: 0; }
    }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="798" height="218" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <circle cx="26" cy="24" r="5" fill="#ff5f56"/><circle cx="44" cy="24" r="5" fill="#ffbd2e"/><circle cx="62" cy="24" r="5" fill="#27c93f"/>

  <!-- commit chain -->
  <line class="line" x1="62" y1="130" x2="342" y2="130" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>

  <!-- files dropping into place -->
  <g fill="#161b22" stroke-width="2">
    <g class="file d1" stroke="#3fb950"><path d="M82 70h18l8 8v22h-26z"/></g>
    <g class="file d2" stroke="#d29922"><path d="M162 70h18l8 8v22h-26z"/></g>
    <g class="file d3" stroke="#39c5cf"><path d="M242 70h18l8 8v22h-26z"/></g>
    <g class="file d4" stroke="#a371f7"><path d="M322 70h18l8 8v22h-26z"/></g>
  </g>

  <!-- commits -->
  <circle class="node t d1" cx="95"  cy="130" r="12" fill="#3fb950"/>
  <circle class="node t d2" cx="175" cy="130" r="12" fill="#d29922"/>
  <circle class="node t d3" cx="255" cy="130" r="12" fill="#39c5cf"/>
  <circle class="node t d4" cx="335" cy="130" r="12" fill="#a371f7"/>

  <!-- title -->
  <text class="title" x="395" y="122" font-size="44" font-weight="700" fill="#e6edf3">Singulate</text>
  <g class="curmove"><rect class="cur" x="397" y="88" width="4" height="40" fill="#3fb950" rx="1"/></g>
  <text class="tag" x="397" y="156" font-size="18" fill="#8b949e">one file <tspan fill="#3fb950">&#8594;</tspan> one commit</text>
  <text class="tag" x="397" y="186" font-size="14" fill="#58a6ff">developed by mehedyk</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 6" width="800" height="6" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3fb950" stop-opacity="0"/><stop offset=".5" stop-color="#39c5cf"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="800" height="6" rx="3"/></clipPath></defs>
<style>.s{animation:sweep 4s ease-in-out infinite}@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(800px)}}
@media (prefers-reduced-motion: reduce){.s{animation:none;transform:translateX(250px)}}</style>
<rect width="800" height="6" rx="3" fill="#30363d" opacity=".6"/>
<g clip-path="url(#c)"><rect class="s" width="300" height="6" fill="url(#g)"/></g></svg>